name: CI

on:
  push:
    # ci/** branches: try a change on every platform before it reaches main.
    branches: [main, "ci/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Pushes to main all finish (slow platforms report too); PR updates replace older runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: just check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake clang git jq \
            libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev libvulkan1

      # rustup reads rust-toolchain.toml (a pinned version, with rustfmt and clippy).
      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      # Checkpoint tests make git snapshots; give git an identity just in case.
      - name: Configure git
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"

      - name: Format, lint and test every build type
        run: just check

  # macOS and Windows: build, lint and test (crack's main platform is Linux; these
  # catch breakage until they're tested on real machines).
  other-platforms:
    name: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: never
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Configure git
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"

      # Errors become annotations, so they can be read without the full log.
      - name: Lint
        shell: bash
        run: |
          set +e
          cargo clippy --all-targets --message-format=short -- -D warnings 2>&1 | tee clippy.txt
          status=${PIPESTATUS[0]}
          # Every error block (dependencies and build scripts too) as one annotation:
          # GitHub keeps only ten per step.
          blocks=$(grep -E -A6 '^error' clippy.txt | head -80 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          [ -n "$blocks" ] && echo "::error title=clippy::$blocks"
          grep -E '^[^ ]+\.rs:[0-9]+:[0-9]+: (error|warning)' clippy.txt | head -8 |
            sed -E 's/^([^:]+):([0-9]+):([0-9]+): (.*)$/::error file=\1,line=\2,col=\3::\4/'
          exit $status

      - name: Test
        shell: bash
        run: |
          set +e
          cargo test 2>&1 | tee test.txt
          status=${PIPESTATUS[0]}
          blocks=$(grep -a -E -A6 "panicked at|^test .* FAILED|^error" test.txt | head -80 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          [ -n "$blocks" ] && echo "::error title=tests::$blocks"
          exit $status

      # The step above runs under Git Bash, so its sandbox tests run beside an open
      # Git Bash; these run with none.
      - name: Windows sandbox tests with no Git Bash open
        if: runner.os == 'Windows' && !cancelled()
        shell: pwsh
        run: |
          $out = cargo test --test windows_sandbox 2>&1 | Out-String
          $status = $LASTEXITCODE
          Write-Output $out
          if ($status -ne 0) {
            $lines = ($out -split "`r?`n" | Select-String -Pattern 'panicked at' -Context 0,4 | ForEach-Object { $_.ToString() -replace "`r?`n", "%0A" }) -join '%0A'
            Write-Output "::error title=sandbox tests (PowerShell)::$lines"
            exit 1
          }

      - name: Headless smoke test against the mock
        shell: bash
        run: |
          cargo build --bin crack --examples
          MOCK_ADDR=127.0.0.1:8765 ./target/debug/examples/mock_provider > mock.txt 2>&1 &
          sleep 3
          set +e
          CRACK_BASE_URL=http://127.0.0.1:8765/v1 CRACK_DATA_DIR="$RUNNER_TEMP/crack" \
            ./target/debug/crack run -m custom/mock --format json "say: hello from CI" > out.json 2> err.txt
          status=$?
          cat out.json err.txt
          if [ $status -ne 0 ] || ! grep -q '"type":"done"' out.json; then
            report=$( { echo "exit $status"; tail -20 out.json; echo "--- stderr"; tail -30 err.txt; echo "--- mock"; tail -10 mock.txt; } | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=smoke::$report"
            exit 1
          fi
