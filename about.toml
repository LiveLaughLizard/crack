# Third-party license notices: `just notices` (cargo-about) writes THIRD-PARTY-NOTICES.
# Every license a dependency uses has to be listed here, or generation fails.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
    "bzip2-1.0.6",
    "0BSD",
    "Unlicense",
    "NCSA",
]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
# crack's own crate is MIT (LICENSE); list only what it depends on.
ignore-build-dependencies = false
ignore-dev-dependencies = true
