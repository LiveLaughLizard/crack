[package]
name = "crack"
version = "0.1.0"
description = "A GPUI coding agent that behaves like a terminal agent CLI"
license = "MIT"
repository = "https://github.com/LiveLaughLizard/crack"
edition = "2024"
rust-version = "1.88"
publish = false

[[bin]]
name = "crack"
path = "src/main.rs"

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = [
    "font-kit",
    "wayland",
    "x11",
] }
# gpui -> gpui_http_client -> zed-async-tar -> xattr 0.2.x reads libc::ENOATTR, which
# libc removed for Linux in 0.2.190. Keep libc below that until gpui ships a fix.
libc = ">=0.2.1, <0.2.190"

# Command line: GUI by default, `crack run` for headless/CI use.
flag-rs = "0.10"

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
# Sessions, checkpoints, memory and the code index (bundled: no system SQLite needed).
rusqlite = { version = "0.43", features = ["bundled"] }
dirs = "5"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Networking runs on its own tokio runtime; results reach the UI over channels.
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "http2",
    "stream",
    "json",
] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "io-util",
    "io-std",
    "process",
    "sync",
    "time",
    "signal",
] }
futures = "0.3"
bytes = "1"

# Tools: .gitignore-aware walking, globbing, regex search, diffs.
ignore = "0.4"
# ripgrep's search engine, for the grep tool and the built-in `rg`.
grep = "0.4"
termcolor = "1"
tree-sitter = "0.27"
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
rmcp = { version = "3.11", default-features = false, features = [
    "client",
    "reqwest",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "auth",
] }
globset = "0.4"
regex = "1"
similar = "2"

# AWS SigV4 for Bedrock.
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
# rmcp's credential-store trait is an async_trait.
async-trait = "0.1"

# Markdown in assistant messages.
pulldown-cmark = { version = "0.12", default-features = false }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

# Which model services the binary can talk to. Excluded services are compiled out.
#   cargo build                                        everything
#   cargo build --no-default-features --features cloud  no Chinese services
#   cargo build --no-default-features                   air-gapped: local servers only
[features]
# Code intelligence: one tree-sitter grammar per language.
lang-rust = ["dep:tree-sitter-rust"]
lang-typescript = ["dep:tree-sitter-typescript"]
lang-javascript = ["dep:tree-sitter-javascript"]
lang-python = ["dep:tree-sitter-python"]
lang-go = ["dep:tree-sitter-go"]
lang-c = ["dep:tree-sitter-c"]
lang-cpp = ["dep:tree-sitter-cpp"]
lang-java = ["dep:tree-sitter-java"]
languages = ["lang-rust", "lang-typescript", "lang-javascript", "lang-python", "lang-go", "lang-c", "lang-cpp", "lang-java"]
default = ["cloud", "china", "yolo", "languages"]
# Hosted providers (Anthropic, OpenAI, Gemini, Bedrock, Vertex AI, Azure, OpenRouter, ...)
# and the webfetch tool.
cloud = []
# Chinese model clouds (Qwen, Kimi, Z.ai / GLM, MiniMax, DeepSeek).
china = ["cloud"]
# YOLO mode: run every tool call without asking (except deny rules), in the window
# and as `crack run --permission-mode auto`. Leave it out for builds that must keep a
# human approving risky actions.
yolo = []
# Always run shell commands in the bubblewrap sandbox; it can't be turned off, and
# without bwrap shell commands are refused.
force-sandbox = []

# The built-in sandbox: Landlock (file access) and namespaces (network).
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[dev-dependencies]
# The MCP tests' OAuth server parses forms and checks PKCE challenges.
url = "2"
base64 = "0.22"
