name: Release

# Pushing a version tag (v0.2.0, ...) builds every build type and publishes a
# GitHub Release with the archives and third-party license notices.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.flavor }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        flavor: [default, no-china, airgap, strict]
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    # The oldest supported Ubuntu, so the binaries run on older glibc too.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake clang file \
            libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev

      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.flavor }}

      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-about

      - name: Check the tag matches Cargo.toml
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(just version)" || {
            echo "Tag $GITHUB_REF_NAME doesn't match version $(just version) in Cargo.toml" >&2
            exit 1
          }

      - name: Build
        run: |
          if [ "${{ matrix.flavor }}" = default ]; then just build; else just build-${{ matrix.flavor }}; fi

      - name: Package
        run: just archive ${{ matrix.flavor }}

      - name: AppImage
        run: just appimage ${{ matrix.flavor }}

      - uses: actions/upload-artifact@v4
        with:
          name: crack-${{ matrix.flavor }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.zsync
          if-no-files-found: error

  build-other:
    name: default (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: aarch64-macos
          - os: windows-latest
            name: x86_64-windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -nE 's/^version = "([^"]+)".*/\1/p' Cargo.toml)
          test "${GITHUB_REF_NAME#v}" = "$version" || { echo "Tag $GITHUB_REF_NAME doesn't match $version" >&2; exit 1; }

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          version=$(sed -nE 's/^version = "([^"]+)".*/\1/p' Cargo.toml)
          name="crack-$version-default-${{ matrix.name }}"
          mkdir -p "dist/$name"
          cargo about generate about.hbs -o "dist/$name/THIRD-PARTY-NOTICES"
          cp LICENSE README.md "dist/$name/"
          if [ "${{ runner.os }}" = Windows ]; then
            cp target/release/crack.exe "dist/$name/"
            (cd dist && 7z a -tzip "$name.zip" "$name" >/dev/null)
          else
            cp target/release/crack "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi
          if [ "${{ runner.os }}" = macOS ]; then
            # A Crack.app with the icon, alongside the plain archive (which self-update uses).
            app="dist/app/Crack.app"
            mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" dist/app/crack.iconset
            cp target/release/crack "$app/Contents/MacOS/crack"
            for size in 16 32 128 256 512; do
              sips -z $size $size assets/icon-512.png --out "dist/app/crack.iconset/icon_${size}x${size}.png" >/dev/null
              double=$((size * 2))
              if [ $double -le 512 ]; then
                sips -z $double $double assets/icon-512.png --out "dist/app/crack.iconset/icon_${size}x${size}@2x.png" >/dev/null
              fi
            done
            iconutil -c icns dist/app/crack.iconset -o "$app/Contents/Resources/crack.icns"
            sed "s/@VERSION@/$version/g" packaging/Info.plist > "$app/Contents/Info.plist"
            (cd dist/app && ditto -c -k --keepParent Crack.app "../$name-app.zip")
            rm -rf dist/app
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: crack-default-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [build, build-other]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum *.tar.gz *.AppImage *.zip > SHA256SUMS

      # crack update only installs releases whose SHA256SUMS is signed with this key
      # (its public half is built into crack). Add the secret key as the repository
      # secret MINISIGN_SECRET_KEY.
      - name: Sign the checksums
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          test -n "$MINISIGN_SECRET_KEY" || { echo "MINISIGN_SECRET_KEY isn't set" >&2; exit 1; }
          sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
          printf '%s\n' "$MINISIGN_SECRET_KEY" > $RUNNER_TEMP/minisign.key
          minisign -S -s $RUNNER_TEMP/minisign.key -m dist/SHA256SUMS -t "crack ${GITHUB_REF_NAME}"
          rm $RUNNER_TEMP/minisign.key

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.zsync
            dist/*.zip
            dist/SHA256SUMS
            dist/SHA256SUMS.minisig
          generate_release_notes: true
